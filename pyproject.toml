[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "spriteforge-mcp"
version = "0.0.0.0"
description = "User-managed Windows sprite workflow MCP daemon"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
  "httpx>=0.28,<0.29",
  "uvicorn>=0.38,<0.39",
  "pydantic>=2.12,<3",
  "pystray==0.19.5",
  "pillow>=12,<13",
  "packaging>=25,<26",
  "psutil>=7,<8",
  "tomlkit>=0.13,<0.14",
]

[project.scripts]
spriteforge = "spriteforge_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<0.15"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.hatch.build.targets.wheel]
packages = ["src/spriteforge_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/*.md", "/pyproject.toml", "/uv.lock"]

